[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "java-backend-notes-agent"
version = "0.1.0"
description = "Human-in-the-loop pipeline for a 65-page beginner Java and Spring Boot handwritten guide"
requires-python = ">=3.11"

[project.scripts]
notes-agent = "notes_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
